[package]
name = "chimera"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local conversation history and delegation across coding harnesses"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.11.0", features = ["schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
