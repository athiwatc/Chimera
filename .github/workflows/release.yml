name: Release

# Publishing is deliberately manual. Tag creation and the tag's CI run happen
# separately and must be approved before an operator dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag (for example v0.1.0)"
        required: true
        type: string
      ci_run_id:
        description: "Successful tag-push CI run ID (artifacts must still exist)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested binaries
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Expected a stable semver tag such as v0.1.0" >&2
            exit 1
          }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" main
          tag_sha=$(git rev-parse "$TAG^{commit}")
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "Tagged commit must be on main" >&2
            exit 1
          }

          version=$(git show "$TAG:Cargo.toml" | sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -1)
          test "$TAG" = "v$version" || {
            echo "Tag does not match Cargo.toml package version" >&2
            exit 1
          }

          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" \
            | jq -e --arg sha "$tag_sha" --arg tag "$TAG" --arg repo "$GH_REPO" '
              .head_sha == $sha and
              .head_branch == $tag and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .repository.full_name == $repo and
              (.path | startswith(".github/workflows/ci.yml@refs/tags/" + $tag))
            '

          # Never replace an existing release or any of its assets.
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite" >&2
            exit 1
          fi

      - name: Download and verify tested CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist artifacts
          for platform in Linux-X64 macOS-ARM64 Windows-X64; do
            name="chimera-$platform"
            archive="$name.tar.gz"
            mkdir -p "artifacts/$name"
            gh run download "$RUN_ID" --repo "$GH_REPO" \
              --name "$name" --dir "artifacts/$name"

            test "$(find "artifacts/$name" -maxdepth 1 -type f | wc -l)" -eq 2
            cp "artifacts/$name/$archive" "artifacts/$name/$archive.sha256" dist/
            (cd dist && sha256sum --check "$archive.sha256")

            binary=chimera
            if [[ "$platform" == Windows-X64 ]]; then binary=chimera.exe; fi
            tar -tzf "dist/$archive" | grep -Fx "./$binary" >/dev/null
            tar -tzf "dist/$archive" | grep -Fx "./README.md" >/dev/null
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
